type Mutation {
  triggerWorkflowRun(
    workflow_id: uuid!
    input: jsonb
  ): TriggerWorkflowRunOutput
}

type Mutation {
  approveStep(
    step_run_id: uuid!
  ): ApproveStepOutput
}

type Mutation {
  webhookTrigger(
    workflow_id: uuid!
    secret: String!
    payload: jsonb
  ): WebhookTriggerOutput
}

type TriggerWorkflowRunOutput {
  run_id: uuid!
  status: String!
  message: String
}

type ApproveStepOutput {
  run_id: uuid!
  status: String!
  message: String
}

type WebhookTriggerOutput {
  run_id: uuid!
  status: String!
  message: String
}
