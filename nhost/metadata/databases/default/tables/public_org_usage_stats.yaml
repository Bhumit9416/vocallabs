table:
  name: org_usage_stats
  schema: public
object_relationships:
  - name: organization
    using:
      manual_configuration:
        remote_table:
          schema: public
          name: organizations
        column_mapping:
          org_id: id
select_permissions:
  - role: user
    permission:
      columns:
        - org_id
        - org_name
        - quota_limit
        - quota_used
        - quota_period_start
        - runs_this_month
        - avg_run_duration_seconds
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
