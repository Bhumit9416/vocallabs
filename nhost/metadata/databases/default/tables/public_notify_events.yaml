table:
  name: notify_events
  schema: public
object_relationships:
  - name: organization
    using:
      foreign_key_constraint_on: org_id
event_triggers:
  - name: notify_event_insert
    definition:
      enable_manual: false
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: "{{NHOST_FUNCTIONS_URL}}/notify-handler"
    headers:
      - name: x-nhost-webhook-secret
        value_from_env: NHOST_WEBHOOK_SECRET
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - org_id
        - workflow_run_id
        - channel
        - message
        - payload
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
