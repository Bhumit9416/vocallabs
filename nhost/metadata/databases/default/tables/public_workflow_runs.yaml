table:
  name: workflow_runs
  schema: public
object_relationships:
  - name: workflow
    using:
      foreign_key_constraint_on: workflow_id
  - name: organization
    using:
      foreign_key_constraint_on: org_id
array_relationships:
  - name: step_runs
    using:
      foreign_key_constraint_on:
        column: workflow_run_id
        table:
          name: step_runs
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - workflow_id
        - org_id
        - status
        - trigger_type
        - triggered_by
        - current_step_position
        - context
        - error
        - started_at
        - completed_at
        - created_at
      filter:
        organization:
          members:
            user_id:
              _eq: X-Hasura-User-Id
      allow_aggregations: true
insert_permissions:
  - role: user
    permission:
      columns:
        - workflow_id
        - org_id
        - status
        - trigger_type
        - triggered_by
        - context
      check:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
update_permissions:
  - role: user
    permission:
      columns:
        - status
        - current_step_position
        - context
        - error
        - started_at
        - completed_at
      filter:
        organization:
          members:
            _and:
              - user_id:
                  _eq: X-Hasura-User-Id
              - role:
                  _in:
                    - owner
                    - editor
      check: null
